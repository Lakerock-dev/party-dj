  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body { min-height: 100%; background: #080808; color: #fff; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    input[type="range"] { cursor: pointer; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .dj-container { max-width:640px; margin:0 auto; padding:18px 16px 40px; display:flex; flex-direction:column; gap:14px; }

    @keyframes gst-pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .gst-live-dot { animation:gst-pulse 1.4s ease-in-out infinite; display:inline-block; }
    .gst-display { font-family:'Bebas Neue', system-ui, sans-serif; letter-spacing:0.04em; }
  </style>
</head>

    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect, useRef } = React;


// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════
const PHASES = [
  { id:"warmup",    name:"Warm-up",   emoji:"🌅", color:"#FFAD60", glow:"#FFAD6033", bg:"#1a1000",
    bpmMin:75,  bpmMax:108, energy:[0.2,0.5],  valence:[0.4,0.75],
    genres:["chill","acoustic","indie-pop","lo-fi-beats"],
    desc:"Ankommen & einstimmen", tip:"Ruhige Vibes – die ersten Gäste trudeln ein" },
  { id:"buildup",   name:"Build-up",  emoji:"🔥", color:"#FF6B6B", glow:"#FF6B6B33", bg:"#1a0808",
    bpmMin:105, bpmMax:122, energy:[0.5,0.72], valence:[0.55,0.88],
    genres:["pop","funk","disco","nu-disco"],
    desc:"Energie steigt an", tip:"Dancefloor füllt sich – Tempo anziehen" },
  { id:"peak",      name:"Peak-Time", emoji:"⚡", color:"#A29BFE", glow:"#A29BFE33", bg:"#0d0a1e",
    bpmMin:122, bpmMax:140, energy:[0.75,1.0], valence:[0.6,1.0],
    genres:["house","techno","edm","electronic"],
    desc:"Volle Energie – alle tanzen", tip:"Maximale Energie – das ist die Stunde" },
  { id:"cooldown",  name:"Cool-Down", emoji:"🌙", color:"#74B9FF", glow:"#74B9FF33", bg:"#00101a",
    bpmMin:85,  bpmMax:112, energy:[0.3,0.62], valence:[0.4,0.72],
    genres:["rnb","soul","pop","indie"],
    desc:"Sanfter Übergang", tip:"Gäste kühlen ab – R&B und Slow Jams" },
  { id:"afterhour", name:"Afterhour", emoji:"🌃", color:"#55EFC4", glow:"#55EFC433", bg:"#001a12",
    bpmMin:65,  bpmMax:92,  energy:[0.1,0.4],  valence:[0.25,0.6],
    genres:["ambient","jazz","lo-fi-beats","deep-house"],
    desc:"Die letzten Nachtschwärmer", tip:"Gedimmtes Licht, tiefer Groove" },
];

const SCOPES = [
  "user-read-playback-state",
  "user-modify-playback-state",
  "user-read-currently-playing",
  "playlist-read-private",
  "playlist-read-collaborative",
  "user-read-private",
  "user-read-email",
  "streaming",
].join(" ");


// window.storage nicht verfügbar in standalone HTML — Firebase übernimmt Gästesync
const store = { async set() {return null;}, async get() {return null;}, async list() {return {keys:[]};} };

// ═══════════════════════════════════════════════════════════════
// PKCE HELPERS
// ═══════════════════════════════════════════════════════════════
const randStr = n => {
  const a = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  return [...crypto.getRandomValues(new Uint8Array(n))].map(x => a[x % a.length]).join("");
};
async function codeChallenge(v) {
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_");
}

// ═══════════════════════════════════════════════════════════════
// SPOTIFY API WRAPPER
// ═══════════════════════════════════════════════════════════════
const sp = token => ({
  async get(path) {
    const r = await fetch(`https://api.spotify.com/v1${path}`, { headers: { Authorization:`Bearer ${token}` } });
    if (r.status === 204) return null;
    const d = await r.json();
    if (!r.ok) throw Object.assign(new Error(d?.error?.message || r.status), { status: r.status });
    return d;
  },
  async put(path, body) {
    return fetch(`https://api.spotify.com/v1${path}`, {
      method:"PUT", headers:{ Authorization:`Bearer ${token}`, "Content-Type":"application/json" },
      body: body != null ? JSON.stringify(body) : undefined,
    });
  },
  async post(path, body) {
    const r = await fetch(`https://api.spotify.com/v1${path}`, {
      method:"POST", headers:{ Authorization:`Bearer ${token}`, "Content-Type":"application/json" },
      body: body != null ? JSON.stringify(body) : undefined,
    });
    if (r.status === 204 || r.status === 200) return null;
    return r.json().catch(() => null);
  },
});

// ═══════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════
const fmtTime = ms => { const s = Math.floor((ms||0)/1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
const STATUS_META = {
  analyzing:{ label:"Analyse…",       color:"#FFAD60" },
  searching:{ label:"Suche…",         color:"#FFAD60" },
  ready:    { label:"Bereit",         color:"#A29BFE" },
  holding:  { label:"Wartet",         color:"#74B9FF" },
  queued:   { label:"Eingeplant",     color:"#55EFC4" },
  notfound: { label:"Nicht gefunden", color:"#FF6B6B" },
  error:    { label:"Fehler",         color:"#FF6B6B" },
  duplicate:{ label:"Schon gespielt", color:"#FFAD60" },
};
const SOURCE_META = {
  dj:       { icon:"🎛️", label:"DJ" },
  rec:      { icon:"🎯", label:"KI" },
  guest:    { icon:"👥", label:"Gast" },
  playlist: { icon:"📀", label:"Playlist" },
};
const UPNEXT_VISIBLE = 5; // sichtbare Plätze in "Als Nächstes"
// Erfahrungswerte: ab wann darf die nächsthöhere Phase vorgeschlagen werden (Minuten)
const DEFAULT_MIN_DURATION = { warmup:30, buildup:20, peak:45, cooldown:20, afterhour:0 };
// Priorität: 0 = sofort, 1 = nächster Song, 2 = normal (Rec/Playlist/DJ-Standardauswahl)
function insertByPriority(list, newItem) {
  const startIdx = list.length > 0 && list[0].committed ? 1 : 0;
  let insertAt = list.length;
  for (let i = startIdx; i < list.length; i++) {
    if (list[i].priority > newItem.priority) { insertAt = i; break; }
  }
  const arr = [...list];
  arr.splice(insertAt, 0, newItem);
  return arr;
}

// ═══════════════════════════════════════════════════════════════
// MAIN COMPONENT
// ═══════════════════════════════════════════════════════════════
function DJController() {

  // ── Auth ──────────────────────────────────────────────────────
  const [screen, setScreen]         = useState("loading");
  const [clientId, setClientId]     = useState(() => localStorage.getItem("dj_cid") || "");
  const [manualToken, setManualToken] = useState("");
  const [showManual, setShowManual] = useState(false);
  const [anthropicKey, setAnthropicKey] = useState(() => localStorage.getItem("dj_anthropic_key") || "");
  const [keyInput, setKeyInput] = useState("");
  const [token, setToken]           = useState(null);

  // ── DJ Core ───────────────────────────────────────────────────
  const [phaseIdx, setPhaseIdx]   = useState(0);
  const [playback, setPlayback]   = useState(null);
  const [recs, setRecs]           = useState([]);
  const [reqInput, setReqInput]   = useState("");
  const [requests, setRequests]   = useState([]);
  const [statusMsg, setStatusMsg] = useState("");
  const [queuedSet, setQueuedSet] = useState(new Set());
  const [volume, setVolumeState]  = useState(70);

  // ── Track-Einschätzung (ersetzt die alte BPM/Energie-Erkennung) ──
  const [trackAssessment, setTrackAssessment] = useState(null);
  const [phaseSuggestion, setPhaseSuggestion] = useState(null);
  const lastTrackIdRef = useRef(null);

  // ── Erfahrungswerte: Mindestdauer pro Phase, bevor ein Wechsel
  // zur nächsthöheren Phase vorgeschlagen wird (Party-Schwung-Logik) ──
  const [minDuration, setMinDuration] = useState(() => {
    try { return { ...DEFAULT_MIN_DURATION, ...JSON.parse(localStorage.getItem("dj_min_duration") || "{}") }; }
    catch { return DEFAULT_MIN_DURATION; }
  });
  const [phaseStartTime, setPhaseStartTime] = useState(() => Date.now());
  const [showPhaseSettings, setShowPhaseSettings] = useState(false);

  useEffect(() => { localStorage.setItem("dj_min_duration", JSON.stringify(minDuration)); }, [minDuration]);

  // ── Phase-Wechsel: Sofort vs. nach aktueller Planung ──────────
  const [pendingChoice, setPendingChoice]   = useState(null); // Phase-Index, der gerade zur Bestätigung wartet
  const [scheduledPhase, setScheduledPhase] = useState(null); // { idx, remaining }

  // ── Autopilot: füllt "Als Nächstes" automatisch aus Empfehlungen ──
  const [autopilotEnabled, setAutopilotEnabled] = useState(false);
  const AUTOPILOT_MIN_DEPTH = 3;

  // ── Guest Voting ──────────────────────────────────────────────
  const [isGuestMode]   = useState(() => { try { return window.location.hash.includes("guest"); } catch { return false; } });
  const [showQR, setShowQR]             = useState(false);
  const [guestInput, setGuestInput]     = useState("");
  const [guestName, setGuestName]       = useState(() => localStorage.getItem("dj_guest_name") || "");
  const [guestSubmits, setGuestSubmits] = useState([]);
  const [djPhase, setDjPhase]           = useState(0);
  const [guestNowPlaying, setGuestNowPlaying] = useState(null);
  const seenGuestKeys  = useRef(new Set());
  const processingReqs = useRef(new Set());

  // ── Setlist ───────────────────────────────────────────────────
  const [setlist, setSetlist]         = useState([]);
  const [showSetlist, setShowSetlist] = useState(false);

  // ── Up Next (app-managed plan, only slot 1 is committed to Spotify) ──
  const [upNext, setUpNext] = useState([]); // [{id, track, reqId, source, committed, djForced, seqNote}]

  // ── Sequenz-Intelligenz ───────────────────────────────────────
  const [trackMeta, setTrackMeta]       = useState({}); // uri → {bpm:[min,max], genre, mood}
  const [seqEnabled, setSeqEnabled]     = useState(true);
  const [isResequencing, setIsResequencing] = useState(false);
  const reseqTimerRef    = useRef(null);
  const isResequencingRef = useRef(false);
  const upNextRef         = useRef([]); // spiegel für closures

  // ── Playlist Source ───────────────────────────────────────────
  const [playlistUrl, setPlaylistUrl]         = useState("");
  const [playlist, setPlaylist]               = useState(null); // { id, name, total, byPhase }
  const [playlistEnabled, setPlaylistEnabled] = useState(false);
  const [playlistLoading, setPlaylistLoading] = useState(false);
  const [recsLoading, setRecsLoading] = useState(false);
  const [playlistQueued, setPlaylistQueued]   = useState(new Set());
  const [showPlaylist, setShowPlaylist]       = useState(false);
  const [expandedPhase, setExpandedPhase]     = useState(null);

  // ── Smart Fade ────────────────────────────────────────────────
  const [smartFade, setSmartFade] = useState(false);
  const [fadeSecs, setFadeSecs]   = useState(12);
  const [isFading, setIsFading]   = useState(false);
  const originalVolRef = useRef(70);  // pre-fade volume target
  const fadeRampRef    = useRef(null); // interval for ramp-up
  const fadeTrackRef   = useRef(null); // last seen track id

  const pollRef   = useRef(null);
  const statusRef = useRef(null);
  const api       = token ? sp(token) : null;
  const phase     = PHASES[phaseIdx];

  const appUrl = (() => { try { return window.location.href.split("#")[0] + "#guest"; } catch { return ""; } })();

  // ── Auth Bootstrap ────────────────────────────────────────────
  useEffect(() => {
    if (isGuestMode) { setScreen("guest"); return; }
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    if (code) { window.history.replaceState({}, "", window.location.pathname); exchangeCode(code); return; }
    const t = localStorage.getItem("dj_token"), exp = parseInt(localStorage.getItem("dj_expiry") || "0");
    if (t && Date.now() < exp - 60_000) { setToken(t); setScreen("dj"); }
    else setScreen("setup");
  }, []);

  async function startAuth() {
    const cid = clientId.trim(); if (!cid) return;
    localStorage.setItem("dj_cid", cid);
    const v = randStr(64), cc = await codeChallenge(v);
    localStorage.setItem("dj_cv", v);
    const url = new URL("https://accounts.spotify.com/authorize");
    url.searchParams.set("client_id", cid); url.searchParams.set("response_type", "code");
    url.searchParams.set("redirect_uri", redirectUri()); url.searchParams.set("code_challenge_method", "S256");
    url.searchParams.set("code_challenge", cc); url.searchParams.set("scope", SCOPES);
    url.searchParams.set("show_dialog", "true");
    window.location.href = url.toString();
  }

  async function exchangeCode(code) {
    const cid = localStorage.getItem("dj_cid"), v = localStorage.getItem("dj_cv");
    try {
      const r = await fetch("https://accounts.spotify.com/api/token", {
        method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" },
        body: new URLSearchParams({ client_id:cid, grant_type:"authorization_code", code, redirect_uri:redirectUri(), code_verifier:v }),
      });
      const d = await r.json();
      if (d.access_token) { storeToken(d.access_token, d.expires_in); setToken(d.access_token); setScreen("dj"); }
      else setScreen("setup");
    } catch { setScreen("setup"); }
  }

  function applyManualToken() { const t = manualToken.trim(); if (!t) return; storeToken(t, 3600); setToken(t); setScreen("dj"); }
  function saveApiKey() {
    const k = keyInput.trim(); if (!k) return;
    localStorage.setItem("dj_anthropic_key", k);
    setAnthropicKey(k); setKeyInput("");
  }
  function clearApiKey() {
    localStorage.removeItem("dj_anthropic_key");
    setAnthropicKey("");
  }
  function storeToken(t, exp) { localStorage.setItem("dj_token", t); localStorage.setItem("dj_expiry", String(Date.now() + exp * 1000)); }
  function redirectUri() { return window.location.origin + window.location.pathname; }
  function logout() {
    ["dj_token","dj_expiry","dj_cid","dj_cv"].forEach(k => localStorage.removeItem(k));
    setToken(null); setPlayback(null); setRecs([]); setRequests([]); setScreen("setup");
  }

  // ── Playback Polling ──────────────────────────────────────────
  useEffect(() => {
    if (screen !== "dj" || !api) return;
    const poll = async () => { try { setPlayback(await api.get("/me/player")); } catch (e) { if (e.status === 401) logout(); } };
    poll();
    pollRef.current = setInterval(poll, 3000);
    return () => clearInterval(pollRef.current);
  }, [screen, token]);

  // ── Up Next: Position 1 verschieben, sobald sie zu spielen beginnt ──
  useEffect(() => {
    if (screen !== "dj" || upNext.length === 0) return;
    const front = upNext[0];
    if (front.committed && playback?.item?.id === front.track.id) {
      setUpNext(prev => prev.slice(1));
      // Geplanter Phasenwechsel: ein Titel aus der ursprünglichen Planung ist nun gespielt
      setScheduledPhase(prev => {
        if (!prev) return prev;
        const left = prev.remaining - 1;
        if (left <= 0) { applyPhaseSwitch(prev.idx); return null; }
        return { ...prev, remaining: left };
      });
    }
  }, [playback?.item?.id, screen]);

  // ── Up Next: neue Position 1 sofort an Spotify übermitteln ──────
  useEffect(() => {
    if (screen !== "dj" || !api || upNext.length === 0) return;
    const front = upNext[0];
    if (!front.committed) {
      setUpNext(prev => prev.map((it, i) => i === 0 ? { ...it, committed:true } : it));
      commitUpNextItem(front);
    }
  }, [screen, upNext, token]);

  // ── Sequenz: upNextRef synchron halten ───────────────────────
  useEffect(() => { upNextRef.current = upNext; }, [upNext]);

  // ── Sequenz: Reorder auslösen wenn freie Queue sich ändert ───
  useEffect(() => {
    if (!seqEnabled || screen !== "dj" || isResequencingRef.current) return;
    const free = upNext.filter(it => !it.committed && !it.djForced);
    if (free.length < 2) return;
    clearTimeout(reseqTimerRef.current);
    reseqTimerRef.current = setTimeout(() => resequenceQueue(upNextRef.current), 900);
  }, [upNext.map(it => it.id).join(","), seqEnabled, screen]);

  // ── Track-Einschätzung: Claude kommentiert den neuen Track ───────
  useEffect(() => {
    if (screen !== "dj" || !playback?.item?.id) return;
    const trackId = playback.item.id;
    if (trackId === lastTrackIdRef.current) return;
    lastTrackIdRef.current = trackId;
    const np = playback.item;
    (async () => {
      try {
        const aiText = await askClaude(`Kurze Einschätzung (max 8 Wörter Deutsch) wie gut "${np.name}" von ${np.artists.map(a=>a.name).join(", ")} zur Party-Phase "${phase.name}" (${phase.desc}) passt. Bei schlechtem Fit eines dieser Wörter nutzen: "zu ruhig", "zu laut", "zu langsam", "zu schnell", "passt nicht". Nur der Satz, keine Anführungszeichen.`, 60);
        setTrackAssessment(aiText || null);
      } catch { setTrackAssessment(null); }
    })();
  }, [playback?.item?.id, screen]);

  // ── Playlist Auto-Queue: direkt aus der von Claude vorsortierten Liste ──
  useEffect(() => {
    if (screen !== "dj" || !api || !playlistEnabled || !playlist || !playback?.item?.id) return;
    const candidates = (playlist.byPhase[phase.id] || []).filter(t => !playlistQueued.has(t.uri));
    if (candidates.length === 0) return;
    const pick = candidates[Math.floor(Math.random() * Math.min(3, candidates.length))];
    queueTrack(pick, null, "playlist", 1).then(ok => {
      if (ok) {
        setPlaylistQueued(prev => new Set([...prev, pick.uri]));
        flash(`📀  Playlist: "${pick.name}" für ${phase.name} eingereiht`, 4000);
      }
    });
  }, [playback?.item?.id, screen, playlistEnabled, playlist]);

  // ── Phasenvorschlag: rein zeitbasiert über die Erfahrungswerte ───
  // (Party-Schwung: nie rückwärts, kein BPM-Datenzugriff mehr nötig)
  useEffect(() => {
    if (screen !== "dj") return;
    const check = () => {
      const nextIdx = phaseIdx + 1;
      if (nextIdx >= PHASES.length) { setPhaseSuggestion(null); return; }
      const elapsedMin = (Date.now() - phaseStartTime) / 60000;
      const minNeeded  = minDuration[PHASES[phaseIdx].id] ?? 0;
      setPhaseSuggestion(elapsedMin >= minNeeded ? nextIdx : null);
    };
    check();
    const iv = setInterval(check, 30000);
    return () => clearInterval(iv);
  }, [screen, phaseIdx, phaseStartTime, minDuration]);

  // ── Sync phase + Now Playing → shared storage (für Gäste) ────
  useEffect(() => {
    if (screen !== "dj") return;
    store.set("dj-phase", String(phaseIdx), true);
  }, [phaseIdx, screen]);

  useEffect(() => {
    if (screen !== "dj" || !playback?.item) return;
    const np = playback.item;
    store.set("dj-nowplaying", JSON.stringify({
      name: np.name,
      artist: np.artists.map(a => a.name).join(", "),
      art: np.album?.images?.[1]?.url || np.album?.images?.[0]?.url || null,
    }), true);
  }, [playback?.item?.id, screen]);

  // ── Guest: poll DJ-Phase + Now Playing ─────────────────────────
  useEffect(() => {
    if (screen !== "guest") return;
    const poll = async () => {
      const r = await store.get("dj-phase", true);
      if (r?.value !== undefined) setDjPhase(parseInt(r.value) || 0);
      const npRes = await store.get("dj-nowplaying", true);
      if (npRes?.value) { try { setGuestNowPlaying(JSON.parse(npRes.value)); } catch {} }
    };
    poll();
    const iv = setInterval(poll, 5000);
    return () => clearInterval(iv);
  }, [screen]);

  // ── DJ: poll guest requests ───────────────────────────────────
  useEffect(() => {
    if (screen !== "dj") return;
    const poll = async () => {
      const keysRes = await store.list("guest-req-", true);
      if (!keysRes?.keys?.length) return;
      for (const key of keysRes.keys) {
        if (seenGuestKeys.current.has(key)) continue;
        seenGuestKeys.current.add(key);
        const res = await store.get(key, true);
        if (!res?.value) continue;
        const req = JSON.parse(res.value);
        const id = `guest-${key}`;
        setRequests(prev => [{ id, input: req.input, status: "analyzing", track: null, note: `👥 ${req.guestName || "Gast"}`, isGuest: true }, ...prev.slice(0, 19)]);
      }
    };
    const iv = setInterval(poll, 5000);
    poll();
    return () => clearInterval(iv);
  }, [screen]);

  // ── Auto-process incoming guest requests ──────────────────────
  useEffect(() => {
    if (screen !== "dj") return;
    requests.filter(r => r.isGuest && r.status === "analyzing" && !processingReqs.current.has(r.id)).forEach(r => {
      processingReqs.current.add(r.id);
      processRequest(r.input, r.id, true);
    });
  }, [requests, screen]);

  // ── Smart Fade: monitor track progress ───────────────────────
  useEffect(() => {
    if (!smartFade || !playback?.item || !api) return;
    const { id, duration_ms } = playback.item;
    const remaining  = duration_ms - playback.progress_ms;
    const threshold  = fadeSecs * 1000;

    // ── New track detected → ramp volume back up ──────────────
    if (id !== fadeTrackRef.current) {
      fadeTrackRef.current = id;
      if (isFading) {
        setIsFading(false);
        const target = originalVolRef.current;
        let cur = volume;
        clearInterval(fadeRampRef.current);
        fadeRampRef.current = setInterval(() => {
          cur = Math.min(target, cur + 5);
          setVolumeState(cur);
          api.put(`/me/player/volume?volume_percent=${cur}`);
          if (cur >= target) clearInterval(fadeRampRef.current);
        }, 350);
      }
      return;
    }

    if (!playback.is_playing) return;

    if (remaining > threshold) {
      // Outside fade zone — keep logging current vol as baseline
      if (!isFading) originalVolRef.current = volume;
    } else if (remaining > 200) {
      // Inside fade zone — scale volume from 100 % → 0 %
      if (!isFading) setIsFading(true);
      const ratio  = remaining / threshold;            // 1.0 → ~0
      const target = Math.max(0, Math.round(originalVolRef.current * ratio));
      setVolumeState(target);
      api.put(`/me/player/volume?volume_percent=${target}`);
    }
  }, [playback, smartFade, fadeSecs]);

  // ── Smart Fade: restore immediately when toggled off ─────────
  useEffect(() => {
    if (!smartFade && isFading) {
      setIsFading(false);
      clearInterval(fadeRampRef.current);
      const target = originalVolRef.current;
      setVolumeState(target);
      api?.put(`/me/player/volume?volume_percent=${target}`);
    }
  }, [smartFade]);

  // ── Phase switch ──────────────────────────────────────────────
  // Wendet den Phasenwechsel tatsächlich an (intern, von beiden Modi genutzt)
  function applyPhaseSwitch(idx) {
    setPhaseIdx(idx); setPhaseSuggestion(null);
    setPhaseStartTime(Date.now());
    flash(`${PHASES[idx].emoji}  ${PHASES[idx].name} — ${PHASES[idx].tip}`, 4000);
    setRequests(prev => prev.map(r =>
      r.status === "holding" && r.holdPhase === PHASES[idx].id ? { ...r, status:"ready", note:"🎯 Passt jetzt zur Phase!" } : r
    ));
    // Queue für neue Phase neu sequenzieren
    clearTimeout(reseqTimerRef.current);
    reseqTimerRef.current = setTimeout(() => resequenceQueue(upNextRef.current), 400);
  }

  // "Sofort": wechselt jetzt, verwirft noch nicht übermittelte Planung,
  // damit Empfehlungen/Playlist sofort zur neuen Phase nachfüllen können.
  function switchPhaseNow(idx) {
    setUpNext(prev => prev.filter(it => it.committed));
    setScheduledPhase(null);
    setPendingChoice(null);
    applyPhaseSwitch(idx);
  }

  // "Nach den 5 Titeln": aktuelle Planung läuft komplett aus, erst danach greift die neue Phase.
  function switchPhaseScheduled(idx) {
    const remaining = upNext.length;
    setPendingChoice(null);
    if (remaining <= 0) { applyPhaseSwitch(idx); return; }
    setScheduledPhase({ idx, remaining });
    flash(`📋  Wechsel zu ${PHASES[idx].name} geplant — nach ${remaining} Titel${remaining === 1 ? "" : "n"}`, 5000);

  // ── Autopilot: füllt "Als Nächstes" automatisch aus Empfehlungen ──
  useEffect(() => {
    if (screen !== "dj" || !autopilotEnabled || !api) return;
    if (upNext.length >= AUTOPILOT_MIN_DEPTH) return;
    const playlistHasCandidates = playlistEnabled && playlist &&
      (playlist.byPhase[phase.id] || []).some(t => !queuedSet.has(t.uri));
    if (playlistHasCandidates) return;
    // Nur Recs einreihen die BPM-technisch zur Phase passen
    const pick = recs.find(t => {
      if (queuedSet.has(t.uri) || upNext.some(it => it.track.uri === t.uri)) return false;
      const meta = trackMeta[t.uri];
      if (!meta?.bpm) return true;
      return meta.bpm[1] >= phase.bpmMin && meta.bpm[0] <= phase.bpmMax;
    });
    if (pick) queueTrack(pick, null, "rec", 2);

  function extractPlaylistId(input) {
    const m = input.match(/playlist[/:]([a-zA-Z0-9]+)/);
    if (m) return m[1];
    if (/^[a-zA-Z0-9]{15,30}$/.test(input.trim())) return input.trim();

    const aiText = await askClaude(`Du bist Musik-Kenner für einen Party-DJ. Phasen: ${PHASES.map(p=>`${p.id} (${p.desc}, ${p.bpmMin}-${p.bpmMax} BPM)`).join(" | ")}.
Ordne jeden Track der am besten passenden Phase zu und gib eine kurze Einschätzung (max 5 Wörter Deutsch).

${list}
Antworte NUR mit JSON-Array, ein Eintrag pro Track in derselben Reihenfolge (kein Markdown):

  // ── CSV-Import (Exportify-Format) ─────────────────────────────────────────
  function importPlaylistCSV(csvText, fileName) {
    try {
      const lines = csvText.trim().split("\n");
      const header = lines[0].split(",").map(h => h.replace(/^"|"$/g, "").trim());
      const col = name => header.findIndex(h => h.toLowerCase().includes(name.toLowerCase()));
      const uriCol = col("Track URI"), nameCol = col("Track Name"), artistCol = col("Artist Name");
      const tempoCol = col("Tempo"), energyCol = col("Energy"), danceCol = col("Danceability");

      const byPhase = {};
      PHASES.forEach(p => (byPhase[p.id] = []));

      let parsed = 0;
      for (let i = 1; i < lines.length; i++) {
        // CSV-Zeilen korrekt parsen (Anführungszeichen berücksichtigen)
        const cols = []; let cur = "", inQ = false;
        for (const ch of lines[i] + ",") {
          if (ch === '"') { inQ = !inQ; }
          else if (ch === "," && !inQ) { cols.push(cur.trim()); cur = ""; }
          else cur += ch;
        }
        const uri = cols[uriCol]?.replace(/^"|"$/g,"");
        const name = cols[nameCol]?.replace(/^"|"$/g,"");
        const artists = cols[artistCol]?.replace(/^"|"$/g,"").split(";")[0];
        const tempo = parseFloat(cols[tempoCol]);
        const energy = parseFloat(cols[energyCol]);
        if (!uri || !name || isNaN(tempo)) continue;

        // Phase anhand BPM + Energie bestimmen
        const track = { id: uri.split(":")[2], uri, name, artists:[{name:artists}], album:{images:[]}, duration_ms:0, note:"" };
        let assigned = false;
        for (const p of PHASES) {
          if (tempo >= p.bpmMin && tempo <= p.bpmMax) {
            byPhase[p.id].push({ ...track, note: `${Math.round(tempo)} BPM · E:${Math.round(energy*100)}%` });
            assigned = true; break;
          }
        }
        if (!assigned) {
          // Nächste Phase nach BPM-Distanz
          const closest = PHASES.reduce((a,b) => {
            const da = Math.min(Math.abs(tempo-a.bpmMin), Math.abs(tempo-a.bpmMax));
            const db = Math.min(Math.abs(tempo-b.bpmMin), Math.abs(tempo-b.bpmMax));
            return da < db ? a : b;
          });
          byPhase[closest.id].push({ ...track, note: `${Math.round(tempo)} BPM · E:${Math.round(energy*100)}%` });
        }
        parsed++;
      }

      const playlistName = fileName.replace(".csv","");
      setPlaylist({ id: "csv", name: playlistName, total: parsed, byPhase });
      setPlaylistQueued(new Set());
      setPlaylistEnabled(true);
      setExpandedPhase(PHASES[phaseIdx].id);
      flash(`✅  ${parsed} Tracks aus CSV geladen und nach Phase sortiert`, 5000);
    } catch(e) {
      flash("❌ CSV-Fehler: " + e.message);
    }
  }

  async function loadPlaylist() {
    const id = extractPlaylistId(playlistUrl);
    if (!id || !api) { flash("❌ Playlist-Link oder -ID ungültig"); return; }
    setPlaylistLoading(true);
    try {
      // Versuch 1: Haupt-Playlist-Endpoint
      const rawR = await fetch(`https://api.spotify.com/v1/playlists/${id}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const rawText = await rawR.text();
      const meta = rawR.ok ? JSON.parse(rawText) : null;
      const tracksInfo = JSON.stringify(meta?.tracks)?.slice(0, 200) || "null";
      document.title = `tracks: ${tracksInfo}`;
      flash(`tracks-Feld: ${tracksInfo.slice(0,80)}`, 30000);
      // Tracks laden: erst /tracks-Endpoint, dann main-Endpoint als Fallback
      let tracks = [];
      try {
        let offset = 0;
        while (offset <= 400) {
          const r = await fetch(`https://api.spotify.com/v1/playlists/${id}/tracks?offset=${offset}&limit=100`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (!r.ok) break;
          const page = await r.json();
          const items = (page?.items || []).map(it => it.track).filter(t => t && t.id);
          tracks = tracks.concat(items);
          if (!page?.next || items.length < 100) break;
          offset += 100;
        }
      } catch {}

      if (tracks.length === 0) {
        const items = (meta?.tracks?.items || []).map(it => it.track).filter(t => t && t.id);
        tracks = items;
        let nextUrl = meta?.tracks?.next || null;
        while (nextUrl && tracks.length <= 400) {
          const r = await fetch(nextUrl, { headers: { Authorization: `Bearer ${token}` } });
          if (!r.ok) break;
          const page = await r.json();
          tracks = tracks.concat((page?.items || []).map(it => it.track).filter(t => t && t.id));
          nextUrl = page?.next || null;
        }
      }

      if (tracks.length === 0) {
        flash("❌ Playlist-Zugriff blockiert — bitte normale Spotify-Playlist verwenden (kein Blend)");
        setPlaylistLoading(false); return;
      }
      flash(`🧠 ${tracks.length} Tracks geladen — Claude klassifiziert…`, 60000);

      flash(`🧠  ${tracks.length} Tracks geladen — Claude klassifiziert…`, 60000);
      if (tracks.length === 0) { flash("⚠️ Keine Tracks aus Playlist geladen — Spotify-Verbindung prüfen"); setPlaylistLoading(false); return; }

      // In Batches von 40 klassifizieren, um den Prompt schlank zu halten
      const byPhase = {};
      PHASES.forEach(p => (byPhase[p.id] = []));
      for (let i = 0; i < tracks.length; i += 40) {
        const batch = tracks.slice(i, i + 40);
        const classifications = await classifyTracksBatch(batch);
        batch.forEach((t, j) => {
          const c = classifications[j];
          const phaseId = c?.phase && byPhase[c.phase] ? c.phase : null;
          if (phaseId) byPhase[phaseId].push({ ...t, note: c.note || "" });
        });
      }

      setPlaylist({ id, name: meta?.name || "Playlist", total: tracks.length, byPhase });
      setPlaylistQueued(new Set());
      flash(`✅  "${meta?.name}" geladen — ${tracks.length} Tracks von Claude eingeordnet`, 5000);
    } catch (e) {
      console.error(e);
      flash("❌ Playlist konnte nicht geladen werden");
    } finally {
      setPlaylistLoading(false);
    }
  }

  function removePlaylist() {

  // ── Queue track → fügt zur lokalen "Als Nächstes"-Planung hinzu ──
  // Spotify selbst erlaubt kein Umsortieren der echten Queue, daher
  // verwaltet die App eine eigene Liste; nur Position 1 wird tatsächlich
  // an Spotify übermittelt (siehe Commit-Effect weiter unten).
  // priority: 0 = sofort (springt vor), 1 = nächster Song, 2 = normal (Standard)
  async function queueTrack(track, reqId = null, source = "dj", priority = 2, force = false, djForced = false) {
    if (!api) return false;
    // Duplikat-Prüfung: bereits in Queue ODER bereits in der Setlist gespielt
    const alreadyPlayed = !force && setlist.some(s => s.uri === track.uri);
    const alreadyQueued = !force && (upNext.some(it => it.track.uri === track.uri) || queuedSet.has(track.uri));
    if (alreadyPlayed || alreadyQueued) {
      if (reqId) setRequests(prev => prev.map(r => r.id === reqId ? {
        ...r, status:"duplicate", track,
        note: alreadyPlayed ? `🔁 "${track.name}" lief heute Abend schon (Setlist)` : `🔁 "${track.name}" ist bereits eingeplant`
      } : r));
      return "duplicate";
    }
    const id = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
    setUpNext(prev => insertByPriority(prev, { id, track, reqId, source, priority, committed:false, djForced, seqNote:"" }));
    setQueuedSet(prev => new Set([...prev, track.uri]));
    if (reqId) setRequests(prev => prev.map(r => r.id === reqId ? { ...r, status:"queued" } : r));
    // Level 1: Metadaten asynchron schätzen (kein await — Track erscheint sofort)
    estimateTrackMeta(track);
    return true;
  }

  // ── Tatsächliche Übermittlung an Spotify (nur für Position 1) ───
  async function commitUpNextItem(item) {
    try {
      await api.post(`/me/player/queue?uri=${encodeURIComponent(item.track.uri)}`);
      setSetlist(prev => [...prev, {
        n: prev.length + 1,
        uri: item.track.uri,
        name: item.track.name,
        artist: item.track.artists.map(a => a.name).join(", "),
        album: item.track.album?.name || "",
        phase: PHASES[phaseIdx].name,
        time: new Date().toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" }),
        source: item.source,
      }]);
      return true;
    } catch {
      flash("❌ Kein aktives Gerät – Spotify öffnen und einen Track starten");
      return false;
    }
  }

  // ── Manuelles Umsortieren (nur unter den noch nicht übermittelten Plätzen) ──
  function moveUpNextItem(idx, dir) {
    setUpNext(prev => {
      const j = idx + dir;
      if (j < 0 || j >= prev.length) return prev;
      if (prev[idx].committed || prev[j].committed) return prev;
      const arr = [...prev];
      [arr[idx], arr[j]] = [arr[j], arr[idx]];
      return arr;
    });
  }

  function removeUpNextItem(idx) {
    setUpNext(prev => {
      const item = prev[idx];
      if (!item || item.committed) return prev;
      setQueuedSet(q => { const n = new Set(q); n.delete(item.track.uri); return n; });
      if (item.reqId) setRequests(rs => rs.map(r => r.id === item.reqId ? { ...r, status:"ready" } : r));
      return prev.filter((_, i) => i !== idx);
    });
  }

  // ── Shared Claude-Call ─────────────────────────────────────────
  async function askClaude(content, maxTokens = 600) {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers: anthropicKey
        ? { "Content-Type":"application/json", "x-api-key": anthropicKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" }
        : { "Content-Type":"application/json" },
      body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:maxTokens, messages:[{ role:"user", content }] }),
    });
    const data = await res.json();
    const text = (data.content?.[0]?.text || "").replace(/```[a-z]*/g, "").replace(/```/g, "").trim();
    return text;
  }

  // ── Level 1: Track-Metadaten schätzen ─────────────────────────
  // Läuft asynchron nach dem Einreihen, befüllt trackMeta-Cache.
  async function estimateTrackMeta(track) {
    if (trackMeta[track.uri]) return;
    try {
      const text = await askClaude(
        `Schätze aus deinem Musikwissen für "${track.name}" von ${track.artists.map(a=>a.name).join(", ")}:
Antworte NUR mit JSON (kein Markdown): {"bpm":[min,max],"genre":"...","mood":"..."}`, 80);
      const meta = JSON.parse(text);
      setTrackMeta(prev => ({ ...prev, [track.uri]: meta }));
    } catch {}
  }

  // ── Level 3: Freie Queue-Slots von Claude neu ordnen ──────────
  // Greift auf committed-Einträge und djForced-Pins nie an.
  // Gästewünsche und KI-Empfehlungen werden gleichwertig behandelt.
  async function resequenceQueue(currentQueue) {
    if (isResequencingRef.current) return;
    const locked = currentQueue.filter(it => it.committed || it.djForced);
    const free   = currentQueue.filter(it => !it.committed && !it.djForced);
    if (free.length < 2) return;

    isResequencingRef.current = true;
    setIsResequencing(true);
    try {
      const np = playback?.item;
      const lastLocked = locked[locked.length - 1];
      const contextLine = lastLocked
        ? `Letzter fixer Titel: "${lastLocked.track.name}" (${lastLocked.source === "guest" ? "Gastwunsch" : lastLocked.source})`
        : np ? `Spielt gerade: "${np.name}" von ${np.artists?.[0]?.name}` : "";

      const list = free.map((it, i) => {
        const m = trackMeta[it.track.uri];
        const bpmStr = m?.bpm ? `${m.bpm[0]}–${m.bpm[1]} BPM` : "BPM unbekannt";
        const srcLabel = { guest:"👥 Gast", playlist:"📀 Playlist", rec:"🎯 KI", dj:"🎛️ DJ" }[it.source] || it.source;
        return `${i}: "${it.track.name}" – ${it.track.artists.map(a=>a.name).join(", ")} [${bpmStr}, ${m?.genre || "?"}, ${m?.mood || "?"}, ${srcLabel}]`;
      }).join("\n");

      const text = await askClaude(
        `Du bist ein erfahrener Party-DJ mit voller Regie über die Songabfolge.
Phase: ${phase.name} (${phase.desc}, Ziel ${phase.bpmMin}–${phase.bpmMax} BPM)
${contextLine}

Tracks zum Anordnen – Gästewünsche und KI-Empfehlungen gleichwertig behandeln:
${list}

Ordne diese Tracks für optimalen Partyfluss:
- Keine BPM-Sprünge >25 zwischen direkt aufeinanderfolgenden Titeln
- Genre- und Stimmungskohärenz
- Spannungsbogen innerhalb der Phase aufbauen

Antworte NUR mit JSON (kein Markdown):
{"order":[i,j,...],"reasons":{"INDEX":"Begründung max 5 Wörter Deutsch"}}`, 350);

      const parsed = JSON.parse(text);
      const order   = parsed.order;
      const reasons = parsed.reasons || {};
      if (!Array.isArray(order) || order.length !== free.length) return;
      const reordered = order.map((srcIdx, newPos) => ({
        ...free[srcIdx],
        seqNote: reasons[String(newPos)] || reasons[String(srcIdx)] || "",
      })).filter(Boolean);
      if (reordered.length !== free.length) return;
      setUpNext([...locked, ...reordered]);
    } catch (e) { console.error("resequence", e); }
    finally { isResequencingRef.current = false; setIsResequencing(false); }
  }

  // ── Process request (AI + Spotify) ───────────────────────────

Party-Verlauf: ${PHASES.map((p,i)=>i===phaseIdx?`[${p.name}←AKTUELL]`:p.name).join(" → ")}
Gäste-Wunsch: "${input}"
Entscheide:

Antworte NUR mit JSON (kein Markdown, keine Backticks):

        ...r, track, note: ai.note || "",
        holdPhase: ai.holdPhase || null,
        status: ai.timing === "hold" ? "holding" : "ready",
      } : r));

      if (ai.timing !== "hold") {
        const priority = ai.timing === "immediate" ? 0 : 1; // 0 = springt vor, 1 = nach aktuellem Song
        const result = await queueTrack(track, reqId, isGuest ? "guest" : "dj", priority);
        if (result === "duplicate") {
          flash(`🔁  "${track.name}" lief heute Abend schon — trotzdem einplanen möglich`, 6000);
        } else if (result) {
          const posHint = ai.timing === "immediate" ? "– sofort als Nächstes" : "– nach dem aktuellen Song";
          flash(`✅  ${ai.note || `"${track.name}" eingeplant`} ${posHint}`);
        }
      } else {
        const holdName = PHASES.find(p => p.id === ai.holdPhase)?.name || "spätere Phase";
        flash(`⏳  "${track.name}" wartet auf ${holdName}`);
      }
    } catch(e) {
      console.error(e);
      setRequests(prev => prev.map(r => r.id === reqId ? { ...r, status:"error", note:"Fehler bei Verarbeitung" } : r));
      flash("❌ Fehler – bitte erneut versuchen");
    }
  }

  // ── DJ: handle manual request ─────────────────────────────────
  async function handleRequest() {
    const input = reqInput.trim(); if (!input || !api) return;
    setReqInput("");
    const reqId = Date.now();
    setRequests(prev => [{ id:reqId, input, status:"analyzing", track:null, note:"", isGuest:false }, ...prev.slice(0,19)]);
    processingReqs.current.add(reqId);
    await processRequest(input, reqId, false);
  }

  // ── Guest: submit request ─────────────────────────────────────
  async function handleGuestSubmit() {
    const input = guestInput.trim(); if (!input) return;
    const name = guestName.trim() || "Gast";
    localStorage.setItem("dj_guest_name", name);
    setGuestInput("");
    const key = `guest-req-${Date.now()}`;
    setGuestSubmits(prev => [{ id:key, input, status:"sending", guestName:name }, ...prev]);
    const ok = await store.set(key, JSON.stringify({ input, guestName:name, ts:Date.now() }), true);
    setGuestSubmits(prev => prev.map(s => s.id === key ? { ...s, status: ok ? "delivered" : "error" } : s));
  }

      ),
      "", `Total: ${setlist.length} Tracks`,
    ].join("\n");
    const blob = new Blob([lines], { type:"text/plain;charset=utf-8" });
    const url  = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement("a"), { href:url, download:`setlist_${new Date().toISOString().slice(0,10)}.txt` });
    a.click(); URL.revokeObjectURL(url);

                </button>
              )}
            </div>
            {setlist.length === 0
              ? <div style={{ textAlign:"center", color:"#333", padding:"20px 0", fontSize:13 }}>Noch keine Tracks eingereiht</div>

                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:12, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{t.name} – {t.artist}</div>
                        <div style={{ fontSize:10, color:"#444" }}>{t.time} · {t.phase}</div>
                      </div>
                      <span style={{ fontSize:11 }}>{t.source==="guest" ? "👥" : t.source==="rec" ? "🎯" : t.source==="playlist" ? "📀" : "🎛️"}</span>
                    </div>

                </div>

          </div>
        )}

        <div className="dj-top-row">
        {/* ── Phase Selector ────────────────────────── */}
        <div style={{ ...S.card(`${phase.bg}88`,`${phase.color}22`), transition:"border-color 1s, box-shadow 1s", boxShadow:`0 0 30px ${phase.glow}` }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
            <div style={S.label}>Party-Phase wechseln</div>
            <button onClick={() => setShowPhaseSettings(v => !v)} title="Erfahrungswerte einstellen" style={{ background:"none", border:"none", color: showPhaseSettings ? phase.color : "#444", cursor:"pointer", fontSize:13, marginBottom:12 }}>⚙️</button>

          {showPhaseSettings && (
            <div style={{ marginBottom:14, padding:"12px 14px", background:"#0a0a0a", borderRadius:10, border:"1px solid #1a1a1a" }}>

                Mindestdauer, bevor ein Wechsel zur <b style={{ color:"#888" }}>nächsthöheren</b> Phase vorgeschlagen wird. Damit bekommt die Party Schwung statt zu früh wieder gedrosselt zu werden.

              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>

                color: i===phaseIdx ? "#000" : i<phaseIdx ? `${p.color}88` : "#444",

          <div style={{ fontSize:13, color:"#aaa", lineHeight:1.5 }}>
            <span style={{ color:phase.color, fontWeight:700 }}>{phase.emoji}  {phase.name}</span>

            <span style={{ fontFamily:"monospace", color:"#555", fontSize:12 }}>{phase.bpmMin}–{phase.bpmMax} BPM</span>

            <div style={{ marginTop:12, padding:"10px 14px", background:`${PHASES[phaseSuggestion].color}11`, border:`1px solid ${PHASES[phaseSuggestion].color}33`, borderRadius:10 }}>

                  <div style={{ fontSize:12, color:PHASES[phaseSuggestion].color, fontWeight:700 }}>

                  </div>
                  <div style={{ fontSize:11, color:"#555", marginTop:3 }}>

                  </div>
                </div>
                <div style={{ display:"flex", gap:6 }}>
                  <button onClick={() => setPendingChoice(phaseSuggestion)} style={{ padding:"6px 12px", borderRadius:8, border:"none", background:PHASES[phaseSuggestion].color, color:"#000", fontSize:11, fontWeight:700, cursor:"pointer" }}>

                  </button>
                  <button onClick={() => setPhaseSuggestion(null)} style={{ padding:"6px 10px", borderRadius:8, border:"1px solid #222", background:"none", color:"#555", fontSize:11, cursor:"pointer" }}>✕</button>
                </div>
              </div>
            </div>
          )}
        </div>

        {/* ── Now Playing ────────────────────────────── */}
        <div style={{ ...S.card("#111",`${phase.color}18`), transition:"border-color 1s", boxShadow: albumArt ? `0 4px 40px ${phase.glow}` : "none" }}>

            const hasCtx = playback?.context?.type === "playlist" || playback?.context?.type === "album";
            if (!hasCtx) return null;
            return (
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12, padding:"8px 12px", background:"#FFAD6011", border:"1px solid #FFAD6033", borderRadius:8 }}>

                  <span style={{ fontSize:11, color:"#FFAD60", fontWeight:700 }}>⚠️ Spotify-Playlist aktiv</span>
                  <div style={{ fontSize:10, color:"#555", marginTop:2 }}>Titelwahl durch Spotify — App übernimmt beim nächsten Schritt</div>
                </div>
                <button onClick={startDJMode} style={{ flexShrink:0, padding:"7px 14px", borderRadius:8, border:"none", background:"#FFAD60", color:"#000", fontSize:11, fontWeight:700, cursor:"pointer", marginLeft:10 }}>
                  🎛️ DJ-Modus starten
                </button>
              </div>
            );
          })()}
          <div style={S.label}>Now Playing</div>
          {np ? (
            <>
              <div style={{ display:"flex", gap:16, alignItems:"center" }}>

                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontWeight:700, fontSize:16, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", marginBottom:4 }}>{np.name}</div>
                  <div style={{ color:"#888", fontSize:13, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{artist}</div>
                  <div style={{ color:"#444", fontSize:11, marginTop:3, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{np.album.name}</div>
                  {/* Claude-Einschätzung statt Audio-Feature-Badges */}
                  {trackAssessment && (() => {
                    const neg = /zu ruhig|zu laut|zu langsam|zu schnell|passt nicht|nicht ideal|unpassend|falsche phase/i.test(trackAssessment);
                    return (
                      <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8, padding:"6px 10px", background: neg ? "#FF6B6B12" : `${phase.color}12`, borderRadius:8, border:`1px solid ${neg ? "#FF6B6B33" : `${phase.color}28`}` }}>
                        <span style={{ fontSize:11, flexShrink:0 }}>🧠</span>
                        <span style={{ fontSize:11, color: neg ? "#FF6B6B" : phase.color, lineHeight:1.4, flex:1 }}>{trackAssessment}</span>
                        {neg && <button onClick={skipNext} style={{ flexShrink:0, padding:"4px 10px", borderRadius:6, border:"none", background:"#FF6B6B", color:"#fff", fontSize:11, fontWeight:700, cursor:"pointer" }}>⏭ Überspringen</button>}
                      </div>
                    );
                  })()}
                </div>
              </div>
              <div style={{ marginTop:16 }}>
                <div style={{ height:3, background:"#1a1a1a", borderRadius:4, overflow:"hidden", marginBottom:6 }}>
                  <div style={{ height:"100%", width:`${progress}%`, background:phase.color, borderRadius:4, transition:"width 3s linear" }} />
                </div>
                <div style={{ display:"flex", justifyContent:"space-between", fontSize:10, color:"#444", fontFamily:"monospace" }}>
                  <span>{fmtTime(playback.progress_ms)}</span><span>{fmtTime(np.duration_ms)}</span>
                </div>
              </div>

              {/* ── Übergangs-Vorschau: blendet beim Fade-In synchron ein ─ */}
              {(() => {
                const next = upNext.length > 0 ? upNext[0] : null;
                if (!next || !smartFade) return null;
                const fadeRatio = isFading ? Math.max(0, 1 - volume / Math.max(1, originalVolRef.current)) : 0;
                if (fadeRatio <= 0) return null;
                const nextArt = next.track.album?.images?.[1]?.url || next.track.album?.images?.[0]?.url;
                const sm = SOURCE_META[next.source] || { icon:"🎵", label:"" };
                const secLeft = playback && np ? Math.round((np.duration_ms - playback.progress_ms) / 1000) : null;
                return (
                  <div style={{ marginTop:14, opacity: fadeRatio, transform:`translateY(${Math.round((1 - fadeRatio) * 12)}px)`, transition:"opacity 2.5s ease, transform 2.5s ease", pointerEvents: fadeRatio > 0.5 ? "auto" : "none" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:8 }}>
                      <div style={{ flex:1, height:1, background:`linear-gradient(90deg, transparent, ${phase.color}44)` }} />
                      <span style={{ fontSize:10, color:phase.color, letterSpacing:"0.08em", fontWeight:600, flexShrink:0 }}>
                        KOMMT ALS NÄCHSTES{secLeft !== null ? ` · in ${secLeft}s` : ""}
                      </span>
                      <div style={{ flex:1, height:1, background:`linear-gradient(90deg, ${phase.color}44, transparent)` }} />
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 14px", background:`${phase.color}0a`, border:`1px solid ${phase.color}33`, borderRadius:10 }}>

                        : <div style={{ width:48, height:48, borderRadius:8, background:"#1a1a1a", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, flexShrink:0 }}>🎵</div>

                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:14, fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{next.track.name}</div>
                        <div style={{ fontSize:11, color:"#888", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{next.track.artists?.map(a => a.name).join(", ")}</div>
                      </div>
                      <span style={{ fontSize:10, padding:"3px 8px", borderRadius:20, background:`${phase.color}22`, color:phase.color, flexShrink:0 }}>{sm.icon} {sm.label}</span>
                    </div>
                  </div>
                );
              })()}
            </>
          ) : (
            <div style={{ textAlign:"center", padding:"24px 0", color:"#333" }}>
              <div style={{ fontSize:36, marginBottom:8 }}>🔇</div>
              <div style={{ fontSize:13 }}>Spotify öffnen und Wiedergabe starten</div>
            </div>
          )}
          <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:18, marginTop:20 }}>
            <button onClick={skipPrev} style={S.ctrlBtn()}>⏮</button>
            <button onClick={togglePlay} style={{ ...S.ctrlBtn(), width:58, height:58, fontSize:22, background:phase.color, color:"#000", boxShadow:`0 4px 24px ${phase.color}66`, transition:"background 1s, box-shadow 1s" }}>

            <button onClick={skipNext} style={S.ctrlBtn()}>⏭</button>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:10, marginTop:16 }}>
            <span style={{ fontSize:13, color:"#444" }}>🔈</span>

            <span style={{ fontSize:13, color:"#444" }}>🔊</span>
            <span style={{ fontFamily:"monospace", fontSize:11, color:"#444", minWidth:28 }}>{volume}%</span>
          </div>
        </div>
        </div>

        {/* ── Up Next ────────────────────────────────── */}
        <div style={S.card("#111", "#1a1a1a")}>
          {/* Header: Label + Sequenz-Toggle */}
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ ...S.label, marginBottom:0 }}>⏭  Als Nächstes{upNext.length > 0 ? ` (${upNext.length})` : ""}</span>
              {isResequencing && <span style={{ fontSize:10, color:"#A29BFE", animation:"pulse 1s infinite" }}>🧠 sortiert…</span>}
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ fontSize:10, color: seqEnabled ? "#A29BFE" : "#444", fontWeight:600 }}>🎼 Sequenz-KI</span>

                <div style={{ position:"absolute", top:2, left: seqEnabled ? 19 : 2, width:15, height:15, borderRadius:"50%", background:"#fff", transition:"left 0.3s" }} />
              </div>
            </div>
          </div>

          {upNext.length === 0 ? (
            <div style={{ textAlign:"center", color:"#333", padding:"16px 0", fontSize:13 }}>Noch nichts geplant</div>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {upNext.slice(0, UPNEXT_VISIBLE).map((item, idx) => {
                const sm   = SOURCE_META[item.source] || { icon:"🎵", label:item.source };
                const art  = item.track.album?.images?.[2]?.url || item.track.album?.images?.[0]?.url;
                const meta = trackMeta[item.track.uri];
                const lockedAbove = idx > 0 && upNext[idx - 1]?.committed;
                const pinned = item.committed || item.djForced;
                return (
                  <div key={item.id} style={{ display:"flex", flexDirection:"column", gap:0, borderRadius:10, background:"#0a0a0a", border:`1px solid ${pinned ? "#222" : "#141414"}`, overflow:"hidden", opacity: item.committed ? 0.75 : 1 }}>
                    <div style={{ display:"flex", gap:10, padding:"10px 12px", alignItems:"center" }}>
                      <span style={{ fontFamily:"monospace", fontSize:11, color:"#333", minWidth:14 }}>{idx + 1}</span>

                        ? <img src={art} style={{ width:36, height:36, borderRadius:6, flexShrink:0 }} alt="" />
                        : <div style={{ width:36, height:36, borderRadius:6, background:"#1a1a1a", display:"flex", alignItems:"center", justifyContent:"center", fontSize:15, flexShrink:0 }}>🎵</div>
                      }
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:13, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{item.track.name}</div>
                        <div style={{ fontSize:11, color:"#555", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{item.track.artists.map(a => a.name).join(", ")}</div>

                          <div style={{ display:"flex", gap:5, marginTop:4, flexWrap:"wrap" }}>

                            {meta.genre && <span style={{ fontSize:9, padding:"1px 6px", borderRadius:20, background:"#1a1a1a", color:"#666" }}>{meta.genre}</span>}
                            {meta.mood && <span style={{ fontSize:9, padding:"1px 6px", borderRadius:20, background:"#1a1a1a", color:"#666" }}>{meta.mood}</span>}
                          </div>
                        )}
                      </div>
                      <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:4, flexShrink:0 }}>
                        <span style={{ fontSize:10, padding:"3px 8px", borderRadius:20, background:"#141414", color:"#888", whiteSpace:"nowrap" }}>{sm.icon} {sm.label}</span>
                        {pinned ? (
                          <span title={item.committed ? "An Spotify übermittelt" : "Manuell gepinnt (DJ)"} style={{ fontSize:12 }}>{item.committed ? "🔒" : "📌"}</span>
                        ) : (
                          <div style={{ display:"flex", gap:4 }}>
                            <button onClick={() => moveUpNextItem(idx, -1)} disabled={lockedAbove} style={S.reorderBtn(lockedAbove)}>↑</button>
                            <button onClick={() => moveUpNextItem(idx, 1)} disabled={idx === upNext.length - 1} style={S.reorderBtn(idx === upNext.length - 1)}>↓</button>
                            <button onClick={() => removeUpNextItem(idx)} style={S.reorderBtn(false)}>✕</button>
                          </div>
                        )}
                      </div>
                    </div>
                    {/* Sequenz-Begründung */}
                    {item.seqNote && !pinned && (
                      <div style={{ padding:"5px 12px 7px 58px", fontSize:10, color:"#A29BFE", borderTop:"1px solid #141414" }}>
                        🧠 {item.seqNote}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
          <p style={{ margin:"10px 0 0", fontSize:11, color:"#333", lineHeight:1.5 }}>
            🔒 An Spotify übermittelt  ·  📌 DJ-gepinnt  ·  Freie Slots werden von der Sequenz-KI nach BPM-Fluss, Genre und Stimmung geordnet.
          </p>
        </div>

        {/* ── Smart Fade ────────────────────────────── */}
        <div style={{ ...S.card("#111", smartFade ? `${phase.color}33` : "#1a1a1a"), transition:"border-color 1s" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div>
              <div style={{ ...S.label, marginBottom:4 }}>🌊  Smart Fade</div>
              <div style={{ fontSize:12, color: isFading ? phase.color : "#444", transition:"color 1s" }}>
                {smartFade
                  ? isFading ? "⬇ Ausblenden läuft…" : `Aktiv — Fade ${fadeSecs} s vor Trackende`
                  : "App-seitige Lautstärke-Überblendung (optional)"}
              </div>
            </div>
            {/* Toggle */}
            <div
              onClick={() => setSmartFade(v => !v)}
              style={{ width:48, height:26, borderRadius:13, background: smartFade ? phase.color : "#1a1a1a", cursor:"pointer", position:"relative", flexShrink:0, transition:"background 0.4s", border:"1px solid #2a2a2a" }}
            >
              <div style={{ position:"absolute", top:3, left: smartFade ? 25 : 3, width:18, height:18, borderRadius:"50%", background:"#fff", transition:"left 0.35s", boxShadow:"0 1px 4px #0008" }} />
            </div>
          </div>

          {smartFade && (
            <div style={{ marginTop:14 }}>
              {/* Fade duration slider */}
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                <span style={{ fontSize:11, color:"#555" }}>Fade-Dauer</span>
                <span style={{ fontSize:11, color:phase.color, fontFamily:"monospace", fontWeight:700, transition:"color 1s" }}>{fadeSecs} s vor Trackende</span>
              </div>
              <input
                type="range" min={5} max={20} value={fadeSecs}
                onChange={e => setFadeSecs(parseInt(e.target.value))}
                style={{ width:"100%", accentColor:phase.color, cursor:"pointer" }}
              />
              <div style={{ display:"flex", justifyContent:"space-between", marginTop:4, fontSize:10, color:"#2a2a2a" }}>
                <span>5 s</span><span>12 s (Standard)</span><span>20 s</span>
              </div>

              {/* Live fade indicator */}
              {isFading && (
                <div style={{ marginTop:10, padding:"8px 14px", background:`${phase.color}11`, border:`1px solid ${phase.color}33`, borderRadius:8, display:"flex", alignItems:"center", gap:10 }}>
                  <span style={{ fontSize:13 }}>⬇</span>
                  <span style={{ fontSize:12, color:phase.color, flex:1 }}>Lautstärke wird ausgeblendet</span>
                  <span style={{ fontFamily:"monospace", fontSize:12, color:phase.color, fontWeight:700 }}>{volume} %</span>
                </div>
              )}

              {/* Mode hint */}
              <p style={{ margin:"10px 0 0", fontSize:11, color:"#2e2e2e", lineHeight:1.5 }}>
                Smart Fade und Spotify Crossfade können <b style={{ color:"#444" }}>kombiniert</b> oder <b style={{ color:"#444" }}>alternativ</b> genutzt werden — aktiviere nur eine Seite für saubere Übergänge.
              </p>
            </div>
          )}
        </div>

        {/* ── Music Request ──────────────────────────── */}
        <div style={S.card("#111","#1a1a1a")}>
          <div style={S.label}>🎤  Musikwunsch</div>
          <div style={{ display:"flex", gap:10 }}>
            <input value={reqInput} onChange={e => setReqInput(e.target.value)} onKeyDown={e => e.key==="Enter" && handleRequest()} placeholder="Songtitel, Künstler oder Stimmungsbeschreibung…" style={S.input} />
            <button onClick={handleRequest} style={{ ...S.sendBtn(phase.color), flexShrink:0, padding:"0 20px", fontSize:18, transition:"background 1s" }}>↗</button>
          </div>
          {statusMsg && (
            <div style={{ marginTop:10, padding:"10px 14px", background:"#0a0a0a", borderRadius:8, fontSize:13, color:"#ccc", borderLeft:`3px solid ${phase.color}`, transition:"border-color 1s" }}>
              {statusMsg}
            </div>
          )}
        </div>

        {/* ── Request List ───────────────────────────── */}
        {requests.length > 0 && (
          <div style={S.card("#111","#1a1a1a")}>
            <div style={S.label}>📋  Wunschliste</div>
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {requests.map(req => {
                const sm = STATUS_META[req.status] || { label:req.status, color:"#666" };
                const art = req.track?.album?.images?.[2]?.url || req.track?.album?.images?.[0]?.url;
                return (
                  <div key={req.id} style={{ display:"flex", gap:12, padding:"11px 12px", borderRadius:10, background:"#0a0a0a", border:`1px solid ${req.isGuest ? "#FFAD6022" : "#141414"}`, alignItems:"center" }}>
                    {art
                      ? <img src={art} style={{ width:42, height:42, borderRadius:6, flexShrink:0 }} alt="" />
                      : <div style={{ width:42, height:42, borderRadius:6, background:"#1a1a1a", display:"flex", alignItems:"center", justifyContent:"center", fontSize:18, flexShrink:0 }}>{req.isGuest ? "👥" : "🎵"}</div>
                    }
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:13, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                        {req.track ? `${req.track.name}  ·  ${req.track.artists[0].name}` : req.input}
                      </div>
                      <div style={{ fontSize:11, color:"#555", marginTop:2, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{req.note || `"${req.input}"`}</div>
                    </div>
                    <div style={{ display:"flex", gap:6, alignItems:"center", flexShrink:0 }}>
                      <span style={{ fontSize:10, padding:"3px 9px", borderRadius:20, background:`${sm.color}22`, color:sm.color, fontWeight:600 }}>{sm.label}</span>
                      {req.status === "holding" && req.track && (
                        <button onClick={() => queueTrack(req.track, req.id, req.isGuest ? "guest" : "dj", 0, false, true)} style={{ fontSize:10, padding:"3px 9px", borderRadius:20, border:"1px solid #222", background:"none", color:"#888", cursor:"pointer" }}>Jetzt ↑</button>
                      )}
                      {req.status === "duplicate" && req.track && (
                        <button onClick={() => queueTrack(req.track, req.id, req.isGuest ? "guest" : "dj", 0, true)} style={{ fontSize:10, padding:"3px 9px", borderRadius:20, border:"1px solid #FFAD6044", background:"none", color:"#FFAD60", cursor:"pointer" }}>Trotzdem ↑</button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* ── Playlist: Passende Titel zur aktuellen Phase ─────── */}
        {playlist && (() => {
          const phaseTracks = playlist.byPhase[phase.id] || [];
          const available   = phaseTracks.filter(t => !playlistQueued.has(t.uri));
          const played      = phaseTracks.filter(t =>  playlistQueued.has(t.uri));
          return (
            <div style={S.card("#111", `${phase.color}22`)}>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
                <div>
                  <div style={{ fontSize:10, color:"#444", textTransform:"uppercase", letterSpacing:"0.08em", fontWeight:600 }}>
                    📀 {playlist.name}
                  </div>
                  <div style={{ fontSize:13, fontWeight:700, color:phase.color, marginTop:3 }}>
                    {phase.emoji} Passend zu {phase.name}
                  </div>
                </div>
                <div style={{ textAlign:"right" }}>
                  <div style={{ fontSize:11, color:phase.color, fontWeight:600 }}>{available.length} verfügbar</div>
                  <div style={{ fontSize:10, color:"#333" }}>{played.length} gespielt</div>
                </div>
              </div>
              {phaseTracks.length === 0 ? (
                <div style={{ fontSize:11, color:"#555", padding:"8px 0" }}>
                  Keine Tracks für diese Phase klassifiziert — Fallback auf Autopilot aktiv
                </div>
              ) : (
                <div style={{ maxHeight:320, overflowY:"auto", display:"flex", flexDirection:"column", gap:6, paddingRight:4 }}>
                  {phaseTracks.map(t => {
                    const done = playlistQueued.has(t.uri);
                    const art  = t.album?.images?.[2]?.url || t.album?.images?.[0]?.url;
                    return (
                      <div key={t.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 10px", borderRadius:8, background:"#0a0a0a", opacity: done ? 0.45 : 1 }}>
                        {art
                          ? <img src={art} style={{ width:36, height:36, borderRadius:6, flexShrink:0 }} alt="" />
                          : <div style={{ width:36, height:36, borderRadius:6, background:"#1a1a1a", display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, flexShrink:0 }}>🎵</div>
                        }
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontSize:12, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", color: done ? "#444" : "#ddd" }}>
                            {done ? "✓ " : ""}{t.name}
                          </div>
                          <div style={{ fontSize:10, color:"#444", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                            {t.artists?.[0]?.name}{t.note ? ` · ${t.note}` : ""}
                          </div>
                        </div>
                        {!done && (
                          <button onClick={() => { queueTrack(t, null, "playlist", 0); setPlaylistQueued(prev => new Set([...prev, t.uri])); }}
                            style={{ flexShrink:0, padding:"4px 10px", borderRadius:6, border:"none", background:`${phase.color}33`, color:phase.color, fontSize:10, fontWeight:700, cursor:"pointer" }}>
                            + Queue
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
              {available.length === 0 && phaseTracks.length > 0 && (
                <div style={{ marginTop:8, fontSize:11, color:"#444" }}>
                  Alle Playlist-Tracks dieser Phase gespielt
                </div>
              )}
            </div>
          );
        })()}

        {/* ── Recommendations ────────────────────────── */}
        {(recs.length > 0 || recsLoading) && (
          <div style={{ ...S.card("#111", autopilotEnabled ? "#A29BFE33" : "#1a1a1a"), transition:"border-color 1s" }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
              <div style={S.label}>🎯  Empfohlen für {phase.name}</div>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ fontSize:10, color: autopilotEnabled ? "#A29BFE" : "#444", fontWeight:600 }}>🤖 Autopilot</span>
                <div onClick={() => setAutopilotEnabled(v => !v)} style={{ width:38, height:21, borderRadius:11, background: autopilotEnabled ? "#A29BFE" : "#1a1a1a", cursor:"pointer", position:"relative", border:"1px solid #2a2a2a" }}>
                  <div style={{ position:"absolute", top:2, left: autopilotEnabled ? 19 : 2, width:15, height:15, borderRadius:"50%", background:"#fff", transition:"left 0.3s" }} />
                </div>
                <button onClick={() => loadRecs(phaseIdx)} style={{ background:"none", border:"none", color:"#444", cursor:"pointer", fontSize:14 }}>↻</button>
              </div>
            </div>
            {autopilotEnabled && (
              <p style={{ margin:"-4px 0 12px", fontSize:11, color:"#A29BFE" }}>Füllt „Als Nächstes" automatisch auf, wenn weniger als {AUTOPILOT_MIN_DEPTH} Titel geplant sind.</p>
            )}
            {recsLoading && recs.length === 0 ? (
              <div style={{ textAlign:"center", color:"#444", padding:"16px 0", fontSize:12 }}>🧠 Claude sucht passende Tracks…</div>
            ) : (
              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                {recs.map(track => {
                  const art = track.album?.images?.[2]?.url || track.album?.images?.[0]?.url;
                  const queued = queuedSet.has(track.uri);
                  return (
                    <div key={track.id} style={{ display:"flex", gap:12, padding:"10px 12px", borderRadius:10, background:"#0a0a0a", border:"1px solid #141414", alignItems:"center" }}>
                      <img src={art} style={{ width:40, height:40, borderRadius:6, flexShrink:0 }} alt="" />
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:13, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{track.name}</div>
                        <div style={{ fontSize:11, color:"#555", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{track.artists.map(a => a.name).join(", ")}{track.note ? ` · 🧠 ${track.note}` : ""}</div>
                      </div>
                      <button onClick={() => !queued && queueTrack(track, null, "rec", 2)} style={{ padding:"6px 14px", borderRadius:8, border:"none", cursor: queued ? "default" : "pointer", background: queued ? "#141414" : phase.color, color: queued ? "#444" : "#000", fontSize:12, fontWeight:700, flexShrink:0, transition:"background 0.3s" }}>
                        {queued ? "✓" : "+ Queue"}
                      </button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// STYLE HELPERS
// ═══════════════════════════════════════════════════════════════
const S = {
  fullCenter:   { display:"flex", alignItems:"center", justifyContent:"center", minHeight:"100vh", background:"#080808", color:"#fff", fontFamily:"'Inter',system-ui,sans-serif" },
  card:         (bg, border) => ({ background:bg, borderRadius:16, padding:18, border:`1px solid ${border}` }),
  label:        { fontSize:10, color:"#444", textTransform:"uppercase", letterSpacing:"0.08em", fontWeight:600, marginBottom:12 },
  gradientText: (c1,c2) => ({ background:`linear-gradient(135deg, ${c1}, ${c2})`, WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }),
  input:        { width:"100%", padding:"12px 16px", borderRadius:10, background:"#1a1a1a", border:"1px solid #242424", color:"#fff", fontSize:14, outline:"none", boxSizing:"border-box", fontFamily:"inherit" },
  spotifyBtn:   { width:"100%", marginTop:10, padding:"13px", background:"linear-gradient(135deg, #1DB954, #17a048)", border:"none", borderRadius:10, color:"#000", fontWeight:700, fontSize:15, cursor:"pointer" },
  ctrlBtn:      () => ({ width:46, height:46, borderRadius:"50%", border:"none", background:"#1a1a1a", color:"#fff", fontSize:16, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center" }),
  reorderBtn:   (disabled) => ({ width:24, height:24, borderRadius:6, border:"1px solid #222", background:"none", color: disabled ? "#222" : "#888", fontSize:11, cursor: disabled ? "default" : "pointer", display:"flex", alignItems:"center", justifyContent:"center", padding:0 }),
  sendBtn:      (color) => ({ borderRadius:10, border:"none", background:`linear-gradient(135deg, ${color}, ${color}bb)`, color:"#000", fontWeight:800, cursor:"pointer" }),
  headerBtn:    { background:"none", border:"1px solid #222", color:"#444", padding:"5px 12px", borderRadius:8, cursor:"pointer", fontSize:12, position:"relative" },
  hint:         { color:"#666", fontSize:13, lineHeight:1.6, margin:"0 0 10px" },
  stepHead:     (c) => ({ fontSize:13, fontWeight:700, color:c, marginBottom:8 }),
};


    const _root = ReactDOM.createRoot(document.getElementById("root"));
    _root.render(React.createElement(DJController));
  </script>
</body>
</html>
